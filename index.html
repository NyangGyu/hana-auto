<title>하나생명 시책 진도현황 이미지 생성기</title>
<style>
  /* Pretendard (웹폰트 · CDN) — 사용자가 지정한 ExtraBold 포함 */
  @font-face{font-family:'Pretendard';font-weight:500;font-style:normal;font-display:swap;
    src:url('https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/woff2/Pretendard-Medium.woff2') format('woff2');}
  @font-face{font-family:'Pretendard';font-weight:600;font-style:normal;font-display:swap;
    src:url('https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/woff2/Pretendard-SemiBold.woff2') format('woff2');}
  @font-face{font-family:'Pretendard';font-weight:700;font-style:normal;font-display:swap;
    src:url('https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/woff2/Pretendard-Bold.woff2') format('woff2');}
  @font-face{font-family:'Pretendard';font-weight:800;font-style:normal;font-display:swap;
    src:url('https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/woff2/Pretendard-ExtraBold.woff2') format('woff2');}

  :root{
    --brand:#005442; --brand-2:#02694f; --gold:#FFD34D; --cream:#FFF8DD; --danger:#E02020;
    --bg:#eef2f0; --panel:#ffffff; --panel-2:#f6faf8; --line:#e2e9e5;
    --text:#1f2a27; --muted:#6b7a75; --accent:#005442; --accent-soft:#e6f0ec;
    --radius:14px; --shadow:0 1px 2px rgba(0,40,30,.05),0 8px 28px rgba(0,50,35,.08);
    --font:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0e1614; --panel:#15201d; --panel-2:#1a2723; --line:#26332e;
      --text:#e7efec; --muted:#9db1aa; --accent:#37d6a6; --accent-soft:#12312a;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);}
  }
  :root[data-theme="light"]{ --bg:#eef2f0; --panel:#ffffff; --panel-2:#f6faf8; --line:#e2e9e5;
    --text:#1f2a27; --muted:#6b7a75; --accent:#005442; --accent-soft:#e6f0ec;
    --shadow:0 1px 2px rgba(0,40,30,.05),0 8px 28px rgba(0,50,35,.08);}
  :root[data-theme="dark"]{ --bg:#0e1614; --panel:#15201d; --panel-2:#1a2723; --line:#26332e;
    --text:#e7efec; --muted:#9db1aa; --accent:#37d6a6; --accent-soft:#12312a;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);
    line-height:1.5;-webkit-font-smoothing:antialiased;font-size:15px}
  .wrap{max-width:1120px;margin:0 auto;padding:0 20px 80px}

  header.top{background:var(--brand);color:#fff;padding:26px 0 22px;
    background-image:radial-gradient(120% 140% at 88% -20%, #0a7a5c 0%, rgba(10,122,92,0) 55%);}
  .top .wrap{padding-top:0;padding-bottom:0}
  .brand-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .logo-dot{width:34px;height:34px;border-radius:9px;background:var(--gold);
    display:grid;place-items:center;color:var(--brand);font-weight:800;font-size:18px;flex:none}
  .top h1{font-size:20px;margin:0;font-weight:800;letter-spacing:-.2px}
  .top p{margin:8px 0 0;color:#bfe3d6;font-size:13.5px;max-width:74ch}
  .top .tag{margin-left:auto;background:var(--gold);color:var(--brand);
    font-weight:800;font-size:12px;padding:5px 11px;border-radius:999px}
  .themetgl{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;
    padding:5px 9px;font-size:12px;cursor:pointer;font-family:inherit;font-weight:700}

  .grid{display:grid;grid-template-columns:1fr;gap:18px;margin-top:24px}
  @media(min-width:880px){.grid{grid-template-columns:350px 1fr}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:20px}
  .panel h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
    margin:0 0 14px;font-weight:700}
  label.fld{display:block;font-size:13px;font-weight:700;margin:0 0 6px;color:var(--text)}
  .hint{font-size:12px;color:var(--muted);margin:5px 0 0}
  input[type=text]{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;
    background:var(--panel-2);color:var(--text);font-family:inherit;font-size:15px;font-weight:600}
  input[type=text]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

  .drop{margin-top:18px;border:2px dashed var(--line);border-radius:12px;background:var(--panel-2);
    padding:26px 16px;text-align:center;cursor:pointer;transition:.15s;position:relative}
  .drop:hover{border-color:var(--accent)}
  .drop.over{border-color:var(--accent);background:var(--accent-soft)}
  .drop .ico{font-size:26px}
  .drop .big{font-weight:700;margin:8px 0 2px;font-size:14px}
  .drop .sm{font-size:12px;color:var(--muted)}
  .drop.has{border-style:solid;border-color:var(--accent)}
  .filechip{display:none;align-items:center;gap:8px;justify-content:center;font-size:13px;font-weight:700;color:var(--accent)}
  .drop.has .filechip{display:flex}
  .drop.has .placeholder{display:none}

  button.primary{margin-top:18px;width:100%;padding:13px;border:none;border-radius:11px;
    background:var(--brand);color:#fff;font-family:inherit;font-weight:800;font-size:15px;cursor:pointer;
    transition:.15s;display:flex;align-items:center;justify-content:center;gap:8px}
  button.primary:hover{background:var(--brand-2)}
  button.primary:disabled{opacity:.45;cursor:not-allowed}
  .status{font-size:13px;color:var(--muted);margin-top:12px;min-height:18px}
  .status.err{color:var(--danger);font-weight:600}
  .prog{height:5px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:12px;display:none}
  .prog.on{display:block}
  .prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}

  .resbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .resbar .count{font-weight:800;font-size:16px}
  .resbar .count span{color:var(--muted);font-weight:600;font-size:14px}
  .btn{padding:10px 15px;border:1.5px solid var(--line);border-radius:10px;background:var(--panel);
    color:var(--text);font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;transition:.15s}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.zip{margin-left:auto;background:var(--brand);color:#fff;border-color:var(--brand)}
  .btn.zip:hover{background:var(--brand-2);color:#fff}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;
    box-shadow:var(--shadow);display:flex;flex-direction:column}
  .card .thumb{background:#0000000d;padding:10px;display:grid;place-items:center}
  .card .thumb img{width:100%;height:auto;border-radius:6px;display:block;box-shadow:0 2px 8px rgba(0,0,0,.12)}
  .card .meta{padding:11px 12px;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px}
  .card .fn{font-size:11.5px;color:var(--muted);font-weight:600;word-break:break-all;line-height:1.35;flex:1}
  .card .dl{flex:none;width:34px;height:34px;border-radius:9px;border:1.5px solid var(--line);
    background:var(--panel-2);cursor:pointer;font-size:15px;display:grid;place-items:center;color:var(--accent)}
  .card .dl:hover{border-color:var(--accent)}
  .empty{color:var(--muted);text-align:center;padding:50px 20px;font-size:14px}
  .empty .ico{font-size:34px;opacity:.5}
  a.hiddn{display:none}
</style>

<header class="top">
  <div class="wrap">
    <div class="brand-row">
      <div class="logo-dot">H</div>
      <h1>하나생명 · 건강보험 시책 진도현황 이미지 생성기</h1>
      <span class="tag" id="dateTag">기준일 자동인식</span>
      <button class="themetgl" id="themeBtn" title="테마 전환">◐ 테마</button>
    </div>
    <p>GRM 지점장 이름과 진도현황 엑셀을 넣으면, 담당 모집인별 진도현황 카드를 PPT 디자인 그대로 PNG로 자동 생성합니다. (Pretendard 웹폰트 사용)</p>
  </div>
</header>

<div class="wrap">
  <div class="grid">
    <div class="panel">
      <h2>입력</h2>
      <label class="fld" for="mgr">GRM 지점장 이름</label>
      <input type="text" id="mgr" placeholder="예) 김민호" autocomplete="off">
      <p class="hint">엑셀 <b>담당지점장</b> 열과 일치하는 이름의 모든 모집인을 출력합니다.</p>
      <div class="drop" id="drop">
        <input type="file" id="file" accept=".xlsx" hidden>
        <div class="placeholder">
          <div class="ico">📄</div>
          <div class="big">엑셀 파일을 여기로 끌어다 놓으세요</div>
          <div class="sm">또는 클릭해서 선택 · .xlsx</div>
        </div>
        <div class="filechip"><span>✓</span><span id="fname"></span></div>
      </div>
      <button class="primary" id="gen" disabled>진도현황 이미지 생성</button>
      <div class="prog" id="prog"><i></i></div>
      <div class="status" id="status"></div>
    </div>

    <div class="panel">
      <div class="resbar">
        <div class="count" id="rcount">결과 <span>— 아직 생성 전</span></div>
        <button class="btn zip" id="zipBtn" style="display:none">⬇ 전체 ZIP 다운로드</button>
      </div>
      <div id="results">
        <div class="empty">
          <div class="ico">🖼️</div>
          <div>지점장 이름과 엑셀을 입력하고 <b>생성</b>을 누르면<br>여기에 모집인별 이미지가 나타납니다.</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
/* ============================================================
   하나생명 시책 진도현황 이미지 생성기 (무외부의존 · Pretendard 웹폰트)
   ============================================================ */
/* ────────────────────────────────────────────────────────────
   ★★★ 매월 바뀌는 값은 전부 여기(CONFIG)에 있습니다 ★★★
   시책이 바뀌면 아래 블록만 고치면 되고, 그 아래 코드는 건드릴 필요 없습니다.
   (현재 값 = 2026년 8월 시책 · 디자인 01~03.PNG 기준)
   ──────────────────────────────────────────────────────────── */
const CONFIG = {
  month     : 8,            // 시책 월 → 헤더 "N월 건강보험 시책", ③ "N월 현재 합산P"
  prevMonth : 7,            // 연속가동 판정 기준 전월 → ③ 배지 "N월 가동 ✓"

  // 구간 문턱(원) — 5개 구간 공통
  thresh  : [100000,200000,300000,500000,700000],
  thLabel : ['10만↑','20만↑','30만↑','50만↑','70만↑'],

  // ① 판매활성화 시상
  sales : {
    max    : '최대 1,100%',
    payout : ['110만','220만','330만','550만','770만'],      // 구간칩 표기
    full   : ['110만원','220만원','330만원','550만원','770만원'], // 하단 배너 표기
  },

  // ② 주요특약 시상 — table은 [헤더, 값] 열 목록. 열 개수는 자유(2열/3열 모두 가능)
  rider : {
    max   : '최대 100% 건당 시상',
    note  : '주요특약 포함 보험료 별로 시상금이 적립',
    table : [ ['10만↑','10만'], ['20만↑','20만'] ],
  },

  // ③ 연속가동 시상
  cont : {
    max    : '최대 400%',
    payout : ['40만','80만','120만','200만','280만'],
    full   : ['40만원','80만원','120만원','200만원','280만원'],
  },

  // 하단 푸터
  footer : {
    lead    : '여기에 기본 시상 + 수수료까지!',
    target  : '대상 상품 (유병자 305, 335, 355, 3105 포함)',
    product : '하나로 누리는 건강, 라이트 3.10.5',
    note    : '※ 일반형과 10년납 이하 [월초 × 50%] 적용 인정 (단, 10년 갱신은 제외) · 설계사 본인계약 부지급 (단, 수익자·친권자는 인정) · [13회차 유지 조건]',
  },
};
/* ──────────────────────────────────────────────────────────── */

const THRESH   = CONFIG.thresh;
const THLABEL  = CONFIG.thLabel;
const SALES_PAYOUT = CONFIG.sales.payout;
const SALES_FULL   = CONFIG.sales.full;
const CONT_PAYOUT  = CONFIG.cont.payout;
const CONT_FULL    = CONFIG.cont.full;

const C = {
  brand:'#005442', gold:'#FFD34D', goldLine:'#E0C860', cream:'#FFF8DD', white:'#FFFFFF',
  gray:'#666666', ink:'#1A1A1A', danger:'#E02020', divider:'#E6E6E6', footer:'#F4F2EC',
  subtitle:'#BFE3D6',
  tierDoneBg:'#005442', tierDoneTx:'#FFFFFF',
  tierCurBg:'#FFF3C4', tierCurTx:'#8A6D00', tierCurBorder:'#E0C860',
  tierFutBg:'#F5F5F5', tierFutTx:'#AAAAAA', tierFutBorder:'#E4E4E4',
  tblLine:'#5A5A5A', footerTx:'#404040',
};
const FONT = "'Pretendard','Malgun Gothic','Apple SD Gothic Neo','Segoe UI Emoji','Segoe UI Symbol',sans-serif";
const WT = {eb:800, b:700, sb:600, md:500};

const comma = n => (Math.round(n)||0).toLocaleString('en-US');
const won   = n => comma(n)+'원';
const sane  = s => String(s==null?'':s).replace(/[\\\/:*?"<>|]/g,'_').replace(/\s+/g,' ').trim();

/* ============================================================
   1) XLSX 읽기 — ZIP 파싱 + 내장 DecompressionStream
   ============================================================ */
function parseZipDir(buf){
  const dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
  let eocd = -1;
  for(let i=buf.length-22; i>=0; i--){ if(dv.getUint32(i,true)===0x06054b50){ eocd=i; break; } }
  if(eocd<0) throw new Error('올바른 엑셀(zip) 형식이 아닙니다.');
  const cdOff = dv.getUint32(eocd+16,true), cnt = dv.getUint16(eocd+10,true);
  const map = {}; let p = cdOff;
  for(let n=0;n<cnt;n++){
    const method=dv.getUint16(p+10,true), compSz=dv.getUint32(p+20,true);
    const nameLen=dv.getUint16(p+28,true), extraLen=dv.getUint16(p+30,true), cmtLen=dv.getUint16(p+32,true);
    const lho=dv.getUint32(p+42,true);
    const name=new TextDecoder().decode(buf.subarray(p+46,p+46+nameLen));
    map[name]={lho,method,compSz}; p += 46+nameLen+extraLen+cmtLen;
  }
  return {buf,dv,map};
}
async function readEntry(zip,name){
  const e=zip.map[name]; if(!e) return null;
  const {dv,buf}=zip;
  const nameLen=dv.getUint16(e.lho+26,true), extraLen=dv.getUint16(e.lho+28,true);
  const start=e.lho+30+nameLen+extraLen;
  const comp=buf.subarray(start,start+e.compSz);
  if(e.method===0) return comp;
  if(typeof DecompressionStream==='undefined')
    throw new Error('이 브라우저는 지원되지 않습니다. 최신 Chrome/Edge를 사용하세요.');
  const stream=new Response(comp.slice()).body.pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
async function readXlsx(arrayBuffer){
  const zip=parseZipDir(new Uint8Array(arrayBuffer));
  const dec=new TextDecoder();
  const xml=async n=>{ const b=await readEntry(zip,n); return b?dec.decode(b):null; };
  const DP=s=>new DOMParser().parseFromString(s,'application/xml');

  const wb=DP(await xml('xl/workbook.xml'));
  const first=[...wb.getElementsByTagName('sheet')][0];
  let rid=first.getAttribute('r:id')||first.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');
  let target=null;
  const relsTxt=await xml('xl/_rels/workbook.xml.rels');
  if(relsTxt&&rid){ const rels=DP(relsTxt);
    for(const rel of rels.getElementsByTagName('Relationship')) if(rel.getAttribute('Id')===rid) target=rel.getAttribute('Target');
  }
  let sheetPath=target?('xl/'+target.replace(/^\/?xl\//,'').replace(/^\//,'')):'xl/worksheets/sheet1.xml';
  if(!zip.map[sheetPath]) sheetPath='xl/worksheets/sheet1.xml';

  const shared=[]; const ssTxt=await xml('xl/sharedStrings.xml');
  if(ssTxt){ for(const si of DP(ssTxt).getElementsByTagName('si')){
    let t=''; for(const tEl of si.getElementsByTagName('t')) t+=tEl.textContent; shared.push(t);
  }}
  const sh=DP(await xml(sheetPath)); const rows=[];
  for(const row of sh.getElementsByTagName('row')){
    const rIdx=parseInt(row.getAttribute('r'),10); const cells={};
    for(const c of row.getElementsByTagName('c')){
      const ref=c.getAttribute('r'); if(!ref) continue;
      const col=ref.replace(/[0-9]/g,''); const t=c.getAttribute('t');
      const vEl=c.getElementsByTagName('v')[0], isEl=c.getElementsByTagName('is')[0];
      let val=null;
      if(t==='s'&&vEl) val=shared[parseInt(vEl.textContent,10)] ?? '';
      else if(t==='inlineStr') val=isEl?isEl.textContent:'';
      else if(t==='str'&&vEl) val=vEl.textContent;
      else if(vEl){ const num=Number(vEl.textContent); val=isNaN(num)?vEl.textContent:num; }
      cells[col]=val;
    }
    rows[rIdx]=cells;
  }
  return rows;
}

/* ============================================================
   2) 모델 계산
   ============================================================ */
function num(v){ const n=Number(v); return isNaN(n)?0:n; }
function str(v){ return v==null?'':String(v).trim(); }
function buildTiers(p,tier,pa){
  return THRESH.map((th,i)=>{
    const k=i+1; const state=k<=tier?'done':(k===tier+1?'current':'future');
    return {no:k, label:THLABEL[i], payout:pa[i], state, short:state==='current'?Math.max(0,th-p):0};
  });
}
const MAXTIER = THRESH.length;
function nextInfo(p,tier,fa){ return tier>=MAXTIER?null:{short:Math.max(0,THRESH[tier]-p),tierNo:tier+1,full:fa[tier]}; }
function rowToModel(r,dateLabel){
  const sP=num(r.G),sT=num(r.H),sA=num(r.I), rc=num(r.J),ra=num(r.K);
  const app=num(r.M)===1, cP=num(r.L),cT=num(r.N),cA=num(r.O);
  return {
    agency:str(r.B), branch:str(r.C), branchCode:str(r.D), name:str(r.E), code:str(r.F), dateLabel,
    sales:{p:sP,tier:sT,award:sA,tiers:buildTiers(sP,sT,SALES_PAYOUT),next:nextInfo(sP,sT,SALES_FULL),maxed:sT>=MAXTIER},
    rider:{count:rc,award:ra},
    cont:{applicable:app,p:cP,tier:cT,award:cA,tiers:buildTiers(cP,cT,CONT_PAYOUT),next:nextInfo(cP,cT,CONT_FULL),maxed:cT>=MAXTIER},
  };
}

/* ============================================================

function renderCard(m){
  const S=2, W=900, H=1300;
  const cv=document.createElement('canvas'); cv.width=W*S; cv.height=H*S;
  const ctx=cv.getContext('2d'); ctx.scale(S,S);
  const PT=pt=>pt*120/72;   // PPTX pt -> px @120dpi (원본 내보내기와 동일)

  const f=(px,w)=>`${WT[w]||700} ${px}px ${FONT}`;
  const tw=(t,px,w)=>{ ctx.font=f(px,w); return ctx.measureText(t).width; };
  function T(t,x,y,px,col,w='eb',align='left'){ ctx.font=f(px,w); ctx.fillStyle=col; ctx.textBaseline='top'; ctx.textAlign=align; ctx.fillText(t,x,y); }
  function rpath(x,y,w,h,r,c){
    const tl=c[0]?r:0,tr=c[1]?r:0,br=c[2]?r:0,bl=c[3]?r:0;
    ctx.beginPath(); ctx.moveTo(x+tl,y);
    ctx.lineTo(x+w-tr,y); ctx.arcTo(x+w,y,x+w,y+tr,tr);
    ctx.lineTo(x+w,y+h-br); ctx.arcTo(x+w,y+h,x+w-br,y+h,br);
    ctx.lineTo(x+bl,y+h); ctx.arcTo(x,y+h,x,y+h-bl,bl);
    ctx.lineTo(x,y+tl); ctx.arcTo(x,y,x+tl,y,tl); ctx.closePath();
  }
  function rrect(x,y,w,h,r,{fill,stroke,sw=2,corners=[1,1,1,1]}={}){
    rpath(x,y,w,h,r,corners);
    if(fill){ ctx.fillStyle=fill; ctx.fill(); }
    if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=sw; ctx.stroke(); }
  }
  function line(x1,y1,x2,y2,col,wd){ ctx.strokeStyle=col; ctx.lineWidth=wd||1; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); }

  ctx.fillStyle='#FFFFFF'; ctx.fillRect(0,0,W,H);

  /* HEADER 0-200 */
  ctx.fillStyle=C.brand; ctx.fillRect(0,0,W,200);
  const g=ctx.createRadialGradient(760,-20,0,760,-20,400);
  g.addColorStop(0,'rgba(12,120,92,.55)'); g.addColorStop(1,'rgba(12,120,92,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,200);
  T(`하나생명 · ${CONFIG.month}월 건강보험 시책`,42,36,PT(21),C.gold,'eb');
  const dl=m.dateLabel||''; const pw=tw(dl,PT(11),'b')+34;
  const PILL_Y=20;                                  // ← 기준일 배지 세로위치 (숫자↑ = 아래로)
  rrect(877-pw,PILL_Y,pw,40,20,{fill:C.gold}); T(dl,877-pw/2,PILL_Y+10,PT(11),C.brand,'b','center'); // 배지 안 텍스트 세로중앙
  (function(){
    const parts=[[m.name+' 팀장님, ',C.white],['현재 달성 현황',C.gold],[' 보내드립니다!',C.white]];
    let gsz=PT(28); const total=()=>parts.reduce((s,p)=>s+tw(p[0],gsz,'eb'),0);
    while(total()>828 && gsz>22) gsz-=1;
    const GREET_Y=80;                               // ← 인사말 세로위치 (숫자↑ = 아래로)
    let x=40; for(const[t,c]of parts){ T(t,x,GREET_Y,gsz,c,'eb'); x+=tw(t,gsz,'eb'); }
  })();
  T(`${m.agency} · ${m.branch} · ${m.code}`,42,139,PT(14),C.subtitle,'sb');

  /* card */
  const CX=22,CW=856,RAD=16,HEAD=52,BAN=48;
  function card(top,hh,title,right,banner,badge,badgeOn){
    rrect(CX,top,CW,hh,RAD,{fill:C.white});
    rrect(CX,top,CW,HEAD,RAD,{fill:C.brand,corners:[1,1,0,0]});
    if(banner) rrect(CX,top+hh-BAN,CW,BAN,RAD,{fill:C.cream,corners:[0,0,1,1]});
    rrect(CX,top,CW,hh,RAD,{stroke:C.brand,sw:2});
    const TITLE_DY=5;                               // ← 섹션 제목/우측%글씨 세로위치 (숫자↑ = 아래로)
    const TITLE_X=CX+21;                            // ← 섹션 제목 좌측위치
    T(title,TITLE_X,top+TITLE_DY,PT(20),C.white,'eb');
    if(right){ let rsz=PT(20); while(tw(right,rsz,'eb')>330&&rsz>18) rsz-=1;
      T(right,CX+CW-26,top+TITLE_DY+(PT(20)-rsz)*0.6,rsz,C.gold,'eb','right'); }
    if(badge){ const bw=tw(badge,PT(12),'eb')+46; const bx=TITLE_X+tw(title,PT(20),'eb')+17;
      rrect(bx,top+6,bw,30,15,{fill:badgeOn?C.gold:'#DDE3DF'});
      T(badge,bx+bw/2,top+11,PT(12),badgeOn?C.brand:'#5B6B64','eb','center'); }
  }
  /* 스탯 셀 — 원본 PPT는 라벨 '좌측정렬', 값 '우측정렬' (01·02.PNG 실측)
     stat(라벨X, 라벨Y, 값우측X, 값Y, ...) */
  const stat=(lx,ly,vx,vy,label,value,vc)=>{
    T(label,lx,ly,PT(10),C.gray,'md','left');
    T(value,vx,vy,PT(20),vc,'eb','right');
  };
  const dividers=(y,xs,h)=>{ h=h||65; xs.forEach(x=>line(x,y,x,y+h,C.divider,1.4)); };
  function tierbox(x,top,t){
    const w=142,h=84; let bg,txc,bd;
    if(t.state==='done'){bg=C.tierDoneBg;txc=C.tierDoneTx;bd=null;}
    else if(t.state==='current'){bg=C.tierCurBg;txc=C.tierCurTx;bd=C.tierCurBorder;}
    else{bg=C.tierFutBg;txc=C.tierFutTx;bd=C.tierFutBorder;}
    rrect(x,top,w,h,12,{fill:bg,stroke:bd,sw:1.6});
    const cx=x+w/2;
    T(t.label,cx,top+9,PT(11),txc,'b','center');
    T(t.payout,cx,top+28,PT(16),txc,'eb','center');
    if(t.state==='done') T('달성 ✓',cx,top+56,PT(10.5),txc,'b','center');
    else if(t.state==='current') T(comma(t.short)+'원 남음',cx,top+58,PT(8),txc,'b','center');
    else T(t.no+'구간',cx,top+57,PT(10.5),txc,'b','center');
  }
  const tierrow=(top,tiers)=>{ const xs=[55,217,378,540,701]; tiers.forEach((t,i)=>tierbox(xs[i],top,t)); };
  function banner(y,nx){
    const sz=PT(16);
    const seq=[[comma(nx.short)+'원 ',C.danger],['더 하면  ',C.ink],[`${nx.tierNo}구간 달성 → `,C.brand],[`${nx.full} 지급!`,C.danger]];
    let wtot=seq.reduce((s,p)=>s+tw(p[0],sz,'eb'),0); let x=(W-wtot)/2;
    for(const[t,c]of seq){ T(t,x,y,sz,c,'eb'); x+=tw(t,sz,'eb'); }
  }

  /* ① 판매 */
  card(230,284,'① 판매활성화 시상',CONFIG.sales.max,true);
  stat( 99,300,257,327,'현재 합산P',won(m.sales.p),C.brand);
  stat(381,300,460,327,'달성 구간', m.sales.tier>0? m.sales.tier+'구간':'미달성', C.ink);
  stat(590,300,796,327,'현재 확정 시상금',won(m.sales.award),C.danger);
  dividers(295,[323,528]);
  tierrow(374,m.sales.tiers);
  if(m.sales.next) banner(476,m.sales.next);
  else if(m.sales.maxed) T(`🎉 최고 ${MAXTIER}구간 달성! 축하합니다`,W/2,476,PT(16),C.brand,'eb','center');

  /* ② 특약 */
  card(540,160,'② 주요특약 시상',CONFIG.rider.max);
  stat(101,609,143,635,'달성 건수',m.rider.count+'건',C.brand);
  stat(269,609,433,635,'현재 확정 시상금',won(m.rider.award),C.danger);
  dividers(602,[231,530]);
  T(CONFIG.rider.note,700,600,PT(11),C.gray,'md','center');
  (function(){
    /* 주요특약 미니표 — 2행(헤더/값) × N열, 회색 격자선 테두리 (01.PNG 실측) */
    const cols=CONFIG.rider.table, n=cols.length;
    const TX=578, TW=243, TY=624, RH=[28,31];        // 표 좌상단/전체폭/행높이
    const cw=TW/n, TH=RH[0]+RH[1];
    rrect(TX,TY,TW,RH[0],0,{fill:C.brand});                     // 헤더행 배경
    rrect(TX,TY+RH[0],TW,RH[1],0,{fill:C.tierCurBg});           // 값행 배경
    const hz=PT(11), vz=PT(11.5);
    cols.forEach(([head,val],i)=>{
      const cx=TX+cw*i+cw/2;
      T(head,cx,TY+RH[0]/2-hz/2,        hz,C.white,     'b', 'center');
      T(val, cx,TY+RH[0]+RH[1]/2-vz/2,  vz,C.tierCurTx,'eb','center');
    });
    ctx.strokeStyle=C.tblLine; ctx.lineWidth=1.3;               // 외곽 + 격자선
    ctx.strokeRect(TX,TY,TW,TH);
    line(TX,TY+RH[0],TX+TW,TY+RH[0],C.tblLine,1.3);
    for(let i=1;i<n;i++) line(TX+cw*i,TY,TX+cw*i,TY+TH,C.tblLine,1.3);
  })();

  /* ③ 연속 */
  const on=m.cont.applicable;
  card(720,284,'③ 연속가동 시상',CONFIG.cont.max,true, on?`${CONFIG.prevMonth}월 가동 ✓`:'해당없음', on);
  if(on){
    stat( 99,789,257,814,`${CONFIG.month}월 현재 합산P`,won(m.cont.p),C.brand);
    stat(381,789,460,814,'달성 구간', m.cont.tier>0? m.cont.tier+'구간':'미달성', C.ink);
    stat(590,789,789,814,'현재 확정 시상금',won(m.cont.award),C.danger);
    dividers(784,[323,528]);
    tierrow(864,m.cont.tiers);
    if(m.cont.next) banner(966,m.cont.next);
    else if(m.cont.maxed) T('🎉 최고 5구간 달성! 축하합니다',W/2,966,PT(16),C.brand,'eb','center');
  } else {
    T('해당없음',W/2,808,PT(20),C.brand,'eb','center');
    tierrow(864, THRESH.map((th,i)=>({no:i+1,label:THLABEL[i],payout:CONT_PAYOUT[i],state:'future',short:0})));
  }

  /* FOOTER 1038-1300 */
  ctx.fillStyle=C.footer; ctx.fillRect(0,1038,W,H-1038);
  T('📋',58,1081,PT(20),C.brand,'eb');
  T(CONFIG.footer.lead,103,1082,PT(20),C.brand,'eb');
  T(CONFIG.footer.target,104,1140,30,C.footerTx,'b');
  T(CONFIG.footer.product,104,1181,43,C.footerTx,'eb');
  const imgs=[[BILL_IMG,690,1055,110,90],[BILL_IMG,770,1085,120,95],[COIN_IMG,760,1150,60,60],[COIN_IMG,700,1180,55,55],[COIN_IMG,820,1165,50,50]];
  for(const[im,ix,iy,iw,ih]of imgs){ try{ if(im.complete&&im.naturalWidth) ctx.drawImage(im,ix,iy,iw,ih); }catch(e){} }
  T(CONFIG.footer.note,W/2,1268,PT(9),C.gray,'md','center');

  return cv;
}

/* ============================================================
   4) ZIP 생성 (STORE) — 한글 파일명(UTF-8)
   ============================================================ */
const CRC_TABLE=(()=>{ const t=new Uint32Array(256);
  for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1); t[n]=c>>>0; } return t; })();
function crc32(u8){ let c=0xFFFFFFFF; for(let i=0;i<u8.length;i++) c=CRC_TABLE[(c^u8[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function buildZip(files){
  const enc=new TextEncoder(); const parts=[]; const central=[]; let offset=0;
  for(const f of files){
    const nb=enc.encode(f.name); const crc=crc32(f.data); const sz=f.data.length;
    const lh=new Uint8Array(30+nb.length); const dv=new DataView(lh.buffer);
    dv.setUint32(0,0x04034b50,true); dv.setUint16(4,20,true); dv.setUint16(6,0x0800,true);
    dv.setUint16(8,0,true); dv.setUint32(14,crc,true); dv.setUint32(18,sz,true); dv.setUint32(22,sz,true);
    dv.setUint16(26,nb.length,true); lh.set(nb,30);
    parts.push(lh,f.data);
    const ch=new Uint8Array(46+nb.length); const cv=new DataView(ch.buffer);
    cv.setUint32(0,0x02014b50,true); cv.setUint16(4,20,true); cv.setUint16(6,20,true);
    cv.setUint16(8,0x0800,true); cv.setUint32(16,crc,true); cv.setUint32(20,sz,true); cv.setUint32(24,sz,true);
    cv.setUint16(28,nb.length,true); cv.setUint32(42,offset,true); ch.set(nb,46);
    central.push(ch); offset+=lh.length+sz;
  }
  let cenSz=0; central.forEach(c=>cenSz+=c.length);
  const eocd=new Uint8Array(22); const ev=new DataView(eocd.buffer);
  ev.setUint32(0,0x06054b50,true); ev.setUint16(8,files.length,true); ev.setUint16(10,files.length,true);
  ev.setUint32(12,cenSz,true); ev.setUint32(16,offset,true);
  return new Blob([...parts,...central,eocd],{type:'application/zip'});
}

/* ============================================================
   5) UI
   ============================================================ */
const $=id=>document.getElementById(id);
let workbookRows=null, generated=[], dateLabel='';

function extractDate(fn){
  let mm=fn.match(/(\d{1,2})[.\-\/](\d{1,2})\s*일?\s*기준/);
  if(mm) return `${mm[1]}.${mm[2]}일 기준`;
  mm=fn.match(/(\d{1,2})[.\-\/](\d{1,2})/);
  if(mm) return `${mm[1]}.${mm[2]}일 기준`;
  return '';
}
function mgrMatch(cellA,input){ const a=str(cellA); if(!a) return false; if(a===input) return true; return a.split('/').map(s=>s.trim()).includes(input); }

$('themeBtn').onclick=()=>{ const r=document.documentElement;
  const cur=r.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  r.setAttribute('data-theme',cur==='dark'?'light':'dark'); };

const drop=$('drop'), fileInput=$('file');
drop.onclick=()=>fileInput.click();
['dragenter','dragover'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add('over');}));
['dragleave','drop'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove('over');}));
drop.addEventListener('drop',ev=>{ const fl=ev.dataTransfer.files[0]; if(fl) handleFile(fl); });
fileInput.onchange=()=>{ if(fileInput.files[0]) handleFile(fileInput.files[0]); };

async function handleFile(fl){
  if(!/\.xlsx$/i.test(fl.name)){ setStatus('.xlsx 파일만 지원합니다.',true); return; }
  setStatus('엑셀을 읽는 중…');
  try{
    workbookRows=await readXlsx(await fl.arrayBuffer());
    dateLabel=extractDate(fl.name);
    $('dateTag').textContent=dateLabel?('기준: '+dateLabel):'기준일 미인식';
    drop.classList.add('has'); $('fname').textContent=fl.name;
    const cnt=workbookRows.filter(r=>r&&r.A&&str(r.A)!=='담당지점장').length;
    setStatus(`읽기 완료 · 데이터 ${cnt.toLocaleString()}행`+(dateLabel?` · 기준일 ${dateLabel}`:''));
    refreshBtn();
  }catch(e){ console.error(e); setStatus('엑셀 읽기 실패: '+e.message,true); workbookRows=null; refreshBtn(); }
}
$('mgr').addEventListener('input',refreshBtn);
function refreshBtn(){ $('gen').disabled=!(workbookRows&&$('mgr').value.trim()); }
function setStatus(t,err){ const s=$('status'); s.textContent=t; s.classList.toggle('err',!!err); }

$('gen').onclick=async ()=>{
  const mgr=$('mgr').value.trim();
  const rows=workbookRows.filter(r=>r&&mgrMatch(r.A,mgr)&&str(r.E));
  if(!rows.length){ setStatus(`'${mgr}' 담당 모집인을 찾지 못했습니다. 이름을 확인하세요.`,true); return; }
  generated.forEach(g=>URL.revokeObjectURL(g.url)); generated=[];
  $('results').innerHTML=''; $('zipBtn').style.display='none';
  const prog=$('prog'); prog.classList.add('on'); const bar=prog.querySelector('i');
  setStatus('폰트·이미지 준비 중…');
  try{ await Promise.all([500,600,700,800].map(w=>document.fonts.load(w+' 40px Pretendard'))); }catch(e){}
  await document.fonts.ready.catch(()=>{});
  await Promise.all([COIN_IMG,BILL_IMG].map(im=>new Promise(r=>{ if(im.complete) r(); else { im.onload=r; im.onerror=r; } })));

  const cardsEl=document.createElement('div'); cardsEl.className='cards'; $('results').appendChild(cardsEl);
  for(let i=0;i<rows.length;i++){
    const m=rowToModel(rows[i],dateLabel);
    const cv=renderCard(m);
    const blob=await new Promise(res=>cv.toBlob(res,'image/png'));
    const fname=`${sane(m.agency)} ${sane(m.branch)} ${sane(m.name)} ${sane(m.code)}.png`.replace(/\s+/g,' ').trim();
    const url=URL.createObjectURL(blob);
    generated.push({name:fname,blob,url,bytes:new Uint8Array(await blob.arrayBuffer())});
    addCard(cardsEl,url,fname);
    bar.style.width=Math.round((i+1)/rows.length*100)+'%';
    if(i%3===0) await new Promise(r=>setTimeout(r,0));
  }
  $('rcount').innerHTML=`결과 <span>· ${rows.length}명 생성 완료${dateLabel?' · '+dateLabel:''}</span>`;
  $('zipBtn').style.display='inline-block';
  setStatus(`${rows.length}명 이미지 생성 완료.`);
  setTimeout(()=>prog.classList.remove('on'),400);
};
function addCard(container,url,fname){
  const el=document.createElement('div'); el.className='card';
  el.innerHTML=`<div class="thumb"><img src="${url}" loading="lazy" alt=""></div>
    <div class="meta"><div class="fn">${fname.replace(/</g,'&lt;')}</div>
    <button class="dl" title="이미지 저장">⬇</button></div>`;
  el.querySelector('.dl').onclick=()=>download(url,fname);
  container.appendChild(el);
}
function download(url,name){ const a=$('anchor'); a.href=url; a.download=name; a.click(); }
$('zipBtn').onclick=async ()=>{
  if(!generated.length) return;
  setStatus('ZIP 압축 중…');
  const blob=buildZip(generated.map(g=>({name:g.name,data:g.bytes})));
  const url=URL.createObjectURL(blob);
  const mgr=sane($('mgr').value.trim());
  download(url,`${mgr} 시책진도현황${dateLabel?'_'+dateLabel.replace(/[^0-9.]/g,''):''}.zip`);
  setTimeout(()=>URL.revokeObjectURL(url),4000);
  setStatus(`${generated.length}개 이미지 ZIP 다운로드 완료.`);
};
</script>
